# Guard: the main CI's iOS job is skipped on pull requests (macOS-runner cost),
# which leaves Kotlin/Native klib compatibility untested on dependency PRs --
# exactly how the coroutines 1.11 bump once landed green on Android-only CI
# and then broke main. Cover dependency, shared API, and Swift integration
# changes, and compile the Swift adapters against the freshly built binary.
name: iOS deps guard

on:
  pull_request:
    paths:
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "settings.gradle.kts"
      - "Package.swift"
      - "Sources/**"
      - "samples/ios/**"
      - "scripts/*swift*"
      - "scripts/tests/**"
      - "kotlin/core/**"
      - "kotlin/app-contract/**"
      - "devices/device-even/**"
      - "devices/device-omi-ios/**"
      - "devices/omi-shared/**"

jobs:
  ios-deps:
    name: iOS Kotlin (deps guard)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Disable generated Flutter Android module
        run: |
          # The generated Flutter module needs local .android/local.properties and a Flutter SDK.
          # It is not tracked, so fresh CI checkouts should not include it; this keeps the job deterministic.
          rm -rf third_party/frame/frame_module/.android

      - name: Run Kotlin/Native tests and assemble XCFramework
        run: |
          ./gradlew --console=plain \
            :core:iosSimulatorArm64Test \
            :device-even:iosSimulatorArm64Test \
            :device-omi-ios:iosSimulatorArm64Test \
            :app-contract:assembleXgGlassKitXCFramework

      - name: Test Swift cancellation and compile the Swift adapters
        run: |
          bash scripts/test-swift-operations.sh
          bash scripts/check-swift-package.sh
