name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Disable generated Flutter Android module
        run: |
          # third_party/frame/frame_module/.android is generated and not tracked.
          # If it appears in a runner checkout, remove it so Gradle configures the non-embedded module set.
          rm -rf third_party/frame/frame_module/.android

      - name: Compile and test Android modules
        run: |
          ./gradlew --console=plain \
            :core:assembleAndroidMain \
            :core-android:compileDebugKotlin \
            :app-contract:assembleAndroidMain \
            :universal:compileDebugKotlin \
            :universal-full:compileDebugKotlin \
            :device-rokid:compileDebugKotlin \
            :device-even:assembleAndroidMain \
            :device-omi:compileDebugKotlin \
            :device-simulator:compileDebugKotlin \
            :device-rayneo-installer:compileDebugKotlin \
            :device-rayneo-runtime:compileDebugKotlin \
            :device-inmo-runtime:compileDebugKotlin \
            :device-android-xr:compileDebugKotlin \
            :device-frame-flutter:compileDebugKotlin \
            :device-inmo-runtime:testDebugUnitTest \
            :device-even:testAndroidHostTest \
            :device-omi:testDebugUnitTest \
            :app-contract:testAndroidHostTest \
            :core-android:testDebugUnitTest \
            :core:testAndroidHostTest

  generated-app:
    name: Generated app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Disable generated Flutter Android module
        run: |
          # third_party/frame/frame_module/.android is generated and not tracked.
          # If it appears in a runner checkout, remove it so Gradle configures the non-embedded module set.
          rm -rf third_party/frame/frame_module/.android

      - name: Build generated simulator app
        run: |
          ./xg-glass init --sim /tmp/generated-check --no-shell-setup
          cd /tmp/generated-check && ./gradlew --console=plain :app:assembleDebug

  llms-full:
    name: Docs / llms-full fresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Verify llms-full freshness
        run: |
          python3 scripts/gen_llms_full.py
          git diff --exit-code llms.txt llms-full.txt

  cli:
    name: ${{ matrix.job-name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            job-name: CLI / Python 3.9
          - os: ubuntu-latest
            python-version: "3.12"
            job-name: CLI / Python 3.12
          - os: windows-latest
            python-version: "3.12"
            job-name: CLI / Windows Python 3.12
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e tools/

      - name: Smoke test CLI
        run: xg-glass --help

      - name: Lint CLI
        run: |
          python -m pip install ruff
          ruff check tools/

      - name: Test CLI
        run: |
          python -m pip install pytest
          python -m pytest tools/tests -q

  ios:
    name: iOS Kotlin
    runs-on: macos-26
    timeout-minutes: 60
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Disable generated Flutter Android module
        run: |
          # The generated Flutter module needs local .android/local.properties and a Flutter SDK.
          # It is not tracked, so fresh CI checkouts should not include it; this keeps the job deterministic.
          rm -rf third_party/frame/frame_module/.android

      - name: Run Kotlin/Native tests and assemble XCFramework
        run: |
          ./gradlew --console=plain \
            :core:iosSimulatorArm64Test \
            :device-omi-ios:iosSimulatorArm64Test \
            :app-contract:assembleXgGlassKitXCFramework

  meta:
    name: Meta Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check Meta package token
        id: meta-token
        env:
          META_PACKAGES_TOKEN: ${{ secrets.META_PACKAGES_TOKEN }}
        run: |
          if [ -n "$META_PACKAGES_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "META_PACKAGES_TOKEN is not configured; skipping Meta adapter compile."
          fi

      - name: Set up Java
        if: steps.meta-token.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.meta-token.outputs.available == 'true'
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        if: steps.meta-token.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Disable generated Flutter Android module
        if: steps.meta-token.outputs.available == 'true'
        run: rm -rf third_party/frame/frame_module/.android

      - name: Compile Meta adapter
        if: steps.meta-token.outputs.available == 'true'
        env:
          META_PACKAGES_TOKEN: ${{ secrets.META_PACKAGES_TOKEN }}
        run: |
          # META_PACKAGES_TOKEN must be a GitHub PAT with read:packages for Meta's GitHub Packages;
          # the default GITHUB_TOKEN cannot read facebook/* packages.
          ./gradlew --console=plain -Pgithub_token="${META_PACKAGES_TOKEN}" :device-meta:compileDebugKotlin
