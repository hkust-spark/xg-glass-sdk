name: Docs

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Disable generated Flutter Android module
        run: |
          # The generated Flutter module needs local .android/local.properties and a Flutter SDK.
          rm -rf third_party/frame/frame_module/.android

      - name: Generate Dokka HTML
        env:
          META_PACKAGES_TOKEN: ${{ secrets.META_PACKAGES_TOKEN }}
        run: |
          if [ -z "$META_PACKAGES_TOKEN" ]; then
            echo "::error::META_PACKAGES_TOKEN is required so Pages docs include xgglass-device-meta."
            exit 1
          fi
          ./gradlew --console=plain -Pgithub_token="${META_PACKAGES_TOKEN}" :dokkaGeneratePublicationHtml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
