version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Gradle majors stay deliberate under #36; keep Gradle aligned with the
      # Android Gradle Plugin compatibility window instead of auto-jumping.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # AGP 9 is the other half of the same coordinated upgrade (#36).
      # Wildcard covers the artifact and the com.android.library/application
      # plugin ids that the version catalog's "agp" key resolves to.
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
      # Kotlin toolchain bumps stay deliberate under #36; the catalog's
      # "kotlin" key resolves to org.jetbrains.kotlin.* plugin ids, and
      # build-logic depends on org.jetbrains.kotlin:* artifacts. Patches
      # within 2.4.x stay allowed. (Deliberately NOT "org.jetbrains.kotlin*",
      # which would also swallow the org.jetbrains.kotlinx ecosystem.)
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # CameraX 1.7+ is beyond the Step 1 compileSdk 36 boundary; revisit in
      # later #36 rounds after the Android minor-API/toolchain frontier moves.
      - dependency-name: "androidx.camera:*"
        versions: [">= 1.7.0"]
      # AndroidX Core 1.18+ needs compileSdk 36.1 minor-API DSL; keep Step 1
      # on the compileSdk 36-compatible frontier until later #36 rounds.
      - dependency-name: "androidx.core:*"
        versions: [">= 1.18.0"]
      # 0.31+ releases progressively require newer Kotlin; keep Maven Publish
      # upgrades deliberate under #36. Both the plugin id and the build-logic
      # artifact form.
      - dependency-name: "com.vanniktech.maven.publish"
      - dependency-name: "com.vanniktech:gradle-maven-publish-plugin"
      # CXR-M 1.2.2 breaks the device-rokid compile and buys nothing we need
      # (see issue #9's SDK survey). The 1.0.4 adapter is hardware-validated;
      # migrate deliberately alongside a Rokid hardware session (#29).
      - dependency-name: "com.rokid.cxr:client-m"

  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
