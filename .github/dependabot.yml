version: 2
registries:
  meta-github-packages:
    # Meta DAT SDK lives on GitHub Packages; Dependabot needs its own
    # credential (Dependabot secret, separate from the Actions secret of
    # the same name) to resolve com.meta.wearable:* metadata.
    type: maven-repository
    url: https://maven.pkg.github.com/facebook/meta-wearables-dat-android
    username: Chikati
    password: ${{ secrets.META_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - meta-github-packages
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Gradle 9.6.1 is the current stable wrapper verified with AGP 9.2.1
      # and Flutter 3.44's flutter-build-aar seam. Keep future minors/majors
      # deliberate until the generated-app and Frame paths are rechecked.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # AGP 9.2.1 pairs with Gradle 9.6.1 in the verified frontier. Wildcard covers the
      # artifact and the com.android.library/application plugin ids that the
      # version catalog's "agp" key resolves to. Patches allowed.
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Kotlin toolchain bumps stay deliberate under #36; the catalog's
      # "kotlin" key resolves to org.jetbrains.kotlin.* plugin ids, and
      # build-logic depends on org.jetbrains.kotlin:* artifacts. Patches
      # within 2.4.x stay allowed. (Deliberately NOT "org.jetbrains.kotlin*",
      # which would also swallow the org.jetbrains.kotlinx ecosystem.)
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # CameraX 1.6.1 is the stable frontier for published SDK transitives.
      # 1.7.0-alpha02 compile-verified on compileSdk 36, so a future stable
      # 1.7.x should land cleanly; Dependabot won't offer prereleases here.
      - dependency-name: "androidx.camera:*"
        versions: [">= 1.8.0"]
      # AndroidX Core 1.18.0 is the verified compileSdk 36 frontier. Core
      # 1.19.0 declares minCompileSdk 37, and the stable SDK repository does
      # not yet publish platforms;android-37.
      - dependency-name: "androidx.core:*"
        versions: [">= 1.19.0"]
      # 0.31+ releases progressively require newer Kotlin; keep Maven Publish
      # upgrades deliberate under #36. Both the plugin id and the build-logic
      # artifact form.
      - dependency-name: "com.vanniktech.maven.publish"
      - dependency-name: "com.vanniktech:gradle-maven-publish-plugin"
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
